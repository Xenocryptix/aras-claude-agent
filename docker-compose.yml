version: '3.8'

services:
  aras-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aras-mcp-server
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      - API_URL=${API_URL:-http://your-aras-server/Server}
      - API_USERNAME=${API_USERNAME:-admin}
      - API_PASSWORD=${API_PASSWORD:-your_password}
      - ARAS_DATABASE=${ARAS_DATABASE:-InnovatorSolutions}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HOST=0.0.0.0
      - PORT=8123
      - LOG_LEVEL=info
      - BASE_PATH=/mcp
    
    volumes:
      - ./docker-config/.env:/app/.env:ro
      - ./logs:/app/logs
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 128M
    
    networks:
      - mcp-network

networks:
  mcp-network:
    external: true

volumes:
  logs:
    driver: local
